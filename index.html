<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cave Duel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111016;
    color: #f4eadb;
    display: grid;
    place-items: center;
    font-family: "Courier New", monospace;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    width: min(100vw, 100dvh, 760px);
    aspect-ratio: 1 / 1;
    box-shadow: 0 0 0 2px #050407, 0 18px 60px rgba(0,0,0,.55);
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #171519;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .hidden { display: none !important; }

  /* ---- UI 2: kucuk pencere ---- */
  #panel { background: rgba(10, 9, 14, .45); }
  .panelBox {
    width: 72%;
    background: #1c1823;
    border: 3px solid #0a0910;
    outline: 2px solid #4a4152;
    padding: 4% 5%;
    text-align: center;
  }
  .panelBox h1 {
    font-size: clamp(10px, 5.5cqw, 26px);
    letter-spacing: 2px;
    color: #d8b765;
    margin-bottom: 4%;
    text-shadow: 2px 2px 0 #0a0910;
  }
  .coinRow {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 5%;
    color: #d8b765; font-weight: bold;
    font-size: clamp(9px, 4.5cqw, 20px);
  }
  .coinRow img { width: clamp(10px, 4cqw, 18px); image-rendering: pixelated; }
  .pbtn {
    display: block; width: 100%;
    margin: 4% 0;
    padding: 4% 0;
    background: #2b2730;
    border: 2px solid #0a0910;
    border-top-color: #665d69;
    border-left-color: #665d69;
    color: #f4eadb;
    font-family: inherit; font-weight: bold;
    font-size: clamp(9px, 4.4cqw, 20px);
    letter-spacing: 1px;
    cursor: pointer;
  }
  .pbtn:active { background: #45404b; border-top-color: #0a0910; border-left-color: #0a0910; }
  .pbtn.gold { color: #d8b765; }

  /* ---- UI 3: tam menu ---- */
  #menu { background: #14111a; flex-direction: column; justify-content: flex-start; }
  #stage { container-type: size; }
  .mHead {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 3% 4%;
    background: #1c1823;
    border-bottom: 3px solid #0a0910;
  }
  .mHead .coinRow { margin: 0; }
  .mHead h2 { font-size: clamp(10px, 5cqw, 22px); color: #d8b765; letter-spacing: 2px; }
  .xbtn {
    background: #3a2f34; border: 2px solid #0a0910;
    color: #f4eadb; font-family: inherit; font-weight: bold;
    font-size: clamp(10px, 4.5cqw, 20px);
    padding: 1% 3%;
    cursor: pointer;
  }
  .tabs { width: 100%; display: flex; }
  .tab {
    flex: 1;
    padding: 3% 0;
    background: #221d29;
    border: 2px solid #0a0910;
    color: #8d8394;
    font-family: inherit; font-weight: bold;
    font-size: clamp(8px, 4cqw, 18px);
    letter-spacing: 1px;
    cursor: pointer;
  }
  .tab.on { background: #2f2a38; color: #d8b765; border-bottom-color: #2f2a38; }
  .mBody { width: 100%; flex: 1; overflow-y: auto; padding: 3% 4%; }
  .card {
    display: flex; align-items: center; gap: 4%;
    background: #1f1a26;
    border: 2px solid #0a0910;
    padding: 3% 4%;
    margin-bottom: 3%;
    cursor: pointer;
  }
  .card.sel { border-color: #d8b765; background: #2a2430; }
  .card.lock { opacity: .8; }
  .card img { width: clamp(16px, 9cqw, 40px); image-rendering: pixelated; }
  .aicon {
    width: clamp(16px, 9cqw, 40px); height: clamp(16px, 9cqw, 40px);
    border: 2px solid #0a0910;
    flex: none;
  }
  .cInfo { flex: 1; text-align: left; }
  .cName { font-weight: bold; color: #f4eadb; font-size: clamp(9px, 4.2cqw, 19px); letter-spacing: 1px; }
  .cStat { color: #8d8394; font-size: clamp(8px, 3.6cqw, 16px); }
  .cAct { font-weight: bold; font-size: clamp(8px, 3.8cqw, 17px); color: #67d06d; text-align: right; }
  .cAct.price { color: #d8b765; }
  .cAct.no { color: #d85850; }
  .statLine {
    display: flex; justify-content: space-between;
    padding: 3% 2%;
    border-bottom: 1px solid #2a2430;
    font-size: clamp(9px, 4.2cqw, 19px);
    font-weight: bold;
  }
  .statLine span:last-child { color: #d8b765; }
</style>
</head>
<body>
<div id="stage">
  <!-- UI 1: mini savas (surekli acik, sifir arayuz) -->
  <canvas id="game" width="140" height="140" aria-label="Cave duel mini battle"></canvas>

  <!-- UI 2: ilk dokunista acilan kucuk pencere -->
  <div id="panel" class="ui hidden">
    <div class="panelBox">
      <h1>CAVE DUEL</h1>
      <div class="coinRow"><img id="coinImg1" alt=""><span id="coinTxt1">0</span></div>
      <button class="pbtn gold" id="btnWeapons">&#9876; SILAH / ZIRH</button>
      <button class="pbtn" id="btnStats">&#9878; BILGI</button>
      <button class="pbtn" id="btnClosePanel">&#10005; KAPAT</button>
    </div>
  </div>

  <!-- UI 3: ikinci dokunusta acilan asil oyun menusu -->
  <div id="menu" class="ui hidden">
    <div class="mHead">
      <h2>MENU</h2>
      <div class="coinRow"><img id="coinImg2" alt=""><span id="coinTxt2">0</span></div>
      <button class="xbtn" id="btnCloseMenu">&#10005;</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="w">SILAH</button>
      <button class="tab" data-tab="a">ZIRH</button>
      <button class="tab" data-tab="i">BILGI</button>
    </div>
    <div class="mBody" id="mBody"></div>
  </div>
</div>

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function drawText(g, text, x, y, color) {
  g.fillStyle = color;
  text = String(text).toUpperCase();
  for (let i = 0; i < text.length; i++) {
    const glyph = FONT[text[i]];
    if (!glyph) continue;
    const gx = x + i * 4;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 3; c++)
        if (glyph[r][c] === "1") g.fillRect(gx + c, y + r, 1, 1);
  }
}

function textWidth(text) { return String(text).length * 4 - 1; }

function rect(g, x, y, w, h, color) {
  g.fillStyle = color;
  g.fillRect(x | 0, y | 0, w | 0, h | 0);
}

const fxCanvas = document.createElement("canvas");
const fxCtx = fxCanvas.getContext("2d");

/* 100x100 kareli sprite sheet cizimi; anchor = karede (50,60) taban orta */
function drawSheet(g, img, frame, cx, footY, scale, flip, flash) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const s = scale;
  let src = img, sx = frame * 100;
  if (flash) {
    fxCanvas.width = 100; fxCanvas.height = 100;
    fxCtx.clearRect(0, 0, 100, 100);
    fxCtx.drawImage(img, frame * 100, 0, 100, 100, 0, 0, 100, 100);
    fxCtx.globalCompositeOperation = "source-atop";
    fxCtx.fillStyle = "#ffffff";
    fxCtx.fillRect(0, 0, 100, 100);
    fxCtx.globalCompositeOperation = "source-over";
    src = fxCanvas; sx = 0;
  }
  g.save();
  g.imageSmoothingEnabled = false;
  if (flip) { g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  g.drawImage(src, sx, 0, 100, 100, (cx - 50 * s) | 0, (footY - 60 * s) | 0, 100 * s, 100 * s);
  g.restore();
}

/* tek kare 0x72 sprite cizimi (sol ust kose bazli) */
function drawFrame(g, img, x, y, scale, flip, flash) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const w = img.naturalWidth * scale;
  const h = img.naturalHeight * scale;
  let src = img;
  if (flash) {
    fxCanvas.width = img.naturalWidth; fxCanvas.height = img.naturalHeight;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    fxCtx.drawImage(img, 0, 0);
    fxCtx.globalCompositeOperation = "source-atop";
    fxCtx.fillStyle = "#ffffff";
    fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
    fxCtx.globalCompositeOperation = "source-over";
    src = fxCanvas;
  }
  g.save();
  g.imageSmoothingEnabled = false;
  if (flip) {
    g.translate((x | 0) + w, y | 0);
    g.scale(-1, 1);
    g.drawImage(src, 0, 0, w, h);
  } else {
    g.drawImage(src, x | 0, y | 0, w, h);
  }
  g.restore();
}

class Particle {
  constructor(x, y, color, power) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - .5) * power;
    this.vy = -Math.random() * power - 8;
    this.life = .25 + Math.random() * .35;
    this.color = color;
    this.size = Math.random() < .45 ? 1 : 2;
  }
  update(dt) {
    this.vy += 145 * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  draw(g) { rect(g, this.x, this.y, this.size, this.size, this.color); }
}

class FloatText {
  constructor(text, x, y, color) {
    this.text = text; this.x = x; this.y = y;
    this.color = color; this.life = .75;
  }
  update(dt) { this.y -= 18 * dt; this.life -= dt; }
  draw(g) { drawText(g, this.text, this.x | 0, this.y | 0, this.color); }
}

/* ---------- kayit ---------- */
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem("caveDuelSave"));
    if (s && typeof s === "object") return s;
  } catch (e) {}
  return null;
}
function persist() {
  try {
    localStorage.setItem("caveDuelSave", JSON.stringify({
      coins: game.coins, wave: game.wave, kills: game.kills,
      weapon: game.weaponIndex, armor: game.armorIndex,
      unlockedW: game.unlockedW, unlockedA: game.unlockedA
    }));
  } catch (e) {}
}

const game = {
  time: 0,
  last: 0,
  heroHp: C.HERO_MAX_HP,
  heroState: "idle", // idle | atk | hurt | dead
  heroT: 0,
  heroHitDone: false,
  enemy: null,
  wave: 1,
  kills: 0,
  coins: 0,
  slashCd: 0,
  autoCd: .85,
  guard: 0,
  shake: 0,
  spawn: 0,
  deadTimer: 0,
  weaponIndex: 0,
  armorIndex: 0,
  unlockedW: [0],
  unlockedA: [0],
  pressed: { slash: false, guard: false },
  particles: [],
  texts: [],
  init() {
    const s = loadSave();
    if (s) {
      this.coins = s.coins | 0;
      this.wave = Math.max(1, s.wave | 0);
      this.kills = s.kills | 0;
      this.weaponIndex = clamp(s.weapon | 0, 0, WEAPONS.length - 1);
      this.armorIndex = clamp(s.armor | 0, 0, ARMORS.length - 1);
      if (Array.isArray(s.unlockedW)) this.unlockedW = s.unlockedW;
      if (Array.isArray(s.unlockedA)) this.unlockedA = s.unlockedA;
      if (!this.unlockedW.includes(this.weaponIndex)) this.weaponIndex = 0;
      if (!this.unlockedA.includes(this.armorIndex)) this.armorIndex = 0;
    }
    this.spawnEnemy();
    requestAnimationFrame(t => this.loop(t));
  },
  currentWeapon() { return WEAPONS[this.weaponIndex]; },
  currentArmor() { return ARMORS[this.armorIndex]; },
  spawnEnemy() {
    const type = ENEMIES[(this.wave - 1) % ENEMIES.length];
    const hpBoost = Math.floor(this.wave * 10 + this.kills * 4);
    const e = {
      type,
      hp: type.hp + hpBoost,
      maxHp: type.hp + hpBoost,
      state: "walk", // walk | idle | atk | hurt | death (sheet)
      t: 0,
      hitDone: false,
      flash: 0,
      alive: true,
      bob: Math.random() * 6.28,
    };
    if (type.kind === "sheet") {
      e.x = C.W + 60;               // anchor: taban orta
      e.targetX = C.W - 32;
    } else {
      e.w = type.w * type.scale;
      e.h = type.h * type.scale;
      e.x = C.W + 20;               // anchor: sol ust
      e.targetX = Math.max(C.W - 8 - e.w, C.HERO_CX + 30);
      e.y = type.flying ? C.GROUND_Y - e.h - 16 : C.GROUND_Y - e.h;
    }
    this.enemy = e;
    this.enemyAtk = C.ENEMY_ATK_CD + Math.random() * .3;
  },
  loop(t) {
    const dt = Math.min((t - this.last) / 1000 || 0, .05);
    this.last = t;
    this.time += dt;
    this.update(dt);
    this.draw();
    requestAnimationFrame(v => this.loop(v));
  },
  update(dt) {
    this.slashCd = Math.max(0, this.slashCd - dt);
    this.autoCd = Math.max(0, this.autoCd - dt);
    this.guard = Math.max(0, this.guard - dt);
    this.shake = Math.max(0, this.shake - dt);
    this.heroT += dt;

    if (this.heroState === "dead") {
      this.deadTimer -= dt;
      if (this.deadTimer <= 0) {
        this.heroHp = C.HERO_MAX_HP;
        this.heroState = "idle";
        this.heroT = 0;
        this.spawn = this.enemy ? 0 : .25;
        this.wave = Math.max(1, this.wave - 1);
      }
    } else {
      if (this.heroState === "atk") {
        const w = this.currentWeapon();
        if (this.heroT >= .28 && !this.heroHitDone) {
          this.heroHitDone = true;
          this.applyHeroHit();
        }
        if (this.heroT >= .42) { this.heroState = "idle"; this.heroT = 0; }
      } else if (this.heroState === "hurt") {
        if (this.heroT >= .3) { this.heroState = "idle"; this.heroT = 0; }
      }
      if (this.pressed.guard && this.guard <= C.GUARD_TIME * .25) this.guard = C.GUARD_TIME;
      if ((this.pressed.slash || this.autoCd <= 0) && this.slashCd <= 0 && this.heroState !== "atk") {
        this.heroAttack();
      }
    }

    if (this.enemy) this.updateEnemy(dt);
    if (!this.enemy && this.spawn > 0) {
      this.spawn -= dt;
      if (this.spawn <= 0) this.spawnEnemy();
    }

    this.particles = this.particles.filter(p => (p.update(dt), p.life > 0));
    this.texts = this.texts.filter(t => (t.update(dt), t.life > 0));
  },
  heroAttack() {
    this.heroState = "atk";
    this.heroT = 0;
    this.heroHitDone = false;
    this.slashCd = this.currentWeapon().cd;
    this.autoCd = .95;
  },
  applyHeroHit() {
    const e = this.enemy;
    if (!e || !e.alive || e.state === "death" || e.x > e.targetX + 8) return;
    const weapon = this.currentWeapon();
    const guardedBonus = this.guard > 0 ? 5 : 0;
    const dmg = C.HERO_DMG + weapon.dmg + Math.floor(this.wave * 1.4) + guardedBonus;
    e.hp -= dmg;
    e.flash = .12;
    const p = this.enemyCenter(e);
    this.texts.push(new FloatText(String(dmg), p.x - 5, p.top - 8, COLORS.gold));
    this.burst(p.x, p.y, COLORS.red, 8, 55);
    this.shake = .08;
    if (e.hp <= 0) {
      e.hp = 0;
      if (e.type.kind === "sheet") {
        e.state = "death"; e.t = 0;
      } else {
        this.finishKill(e);
      }
    } else if (e.type.kind === "sheet" && e.state !== "atk") {
      e.state = "hurt"; e.t = 0;
    }
  },
  enemyCenter(e) {
    if (e.type.kind === "sheet") {
      const s = e.type.scale;
      return { x: e.x, y: C.GROUND_Y - 10 * s, top: C.GROUND_Y - 21 * s };
    }
    return { x: e.x + e.w / 2, y: e.y + e.h / 2, top: e.y };
  },
  updateEnemy(dt) {
    const e = this.enemy;
    e.bob += dt * 5;
    e.flash = Math.max(0, e.flash - dt);
    e.t += dt;

    if (e.state === "death") {
      if (e.t >= .5) this.finishKill(e);
      return;
    }
    if (e.state === "hurt") {
      if (e.t >= .25) { e.state = "idle"; e.t = 0; }
      return;
    }
    if (e.state === "walk") {
      e.x -= 42 * dt;
      if (e.x <= e.targetX) { e.x = e.targetX; e.state = "idle"; e.t = 0; }
      return;
    }
    if (e.state === "atk") {
      if (e.t >= .3 && !e.hitDone) {
        e.hitDone = true;
        this.applyEnemyHit(e);
      }
      if (e.t >= .48) { e.state = "idle"; e.t = 0; }
      return;
    }
    // idle: saldiri bekleme
    if (this.heroState !== "dead") {
      this.enemyAtk -= dt;
      if (this.enemyAtk <= 0) {
        e.state = "atk"; e.t = 0; e.hitDone = false;
        this.enemyAtk = C.ENEMY_ATK_CD + Math.random() * .35 - this.wave * .015;
      }
    }
  },
  applyEnemyHit(e) {
    if (this.heroState === "dead") return;
    const blocked = this.guard > 0;
    const def = this.currentArmor().def;
    let dmg;
    if (blocked) {
      dmg = Math.max(1, Math.floor(e.type.dmg * .28) - Math.floor(def / 2));
    } else {
      dmg = Math.max(1, e.type.dmg + Math.floor(this.wave * .7) - def);
    }
    this.heroHp -= dmg;
    this.texts.push(new FloatText(blocked ? "GUARD" : String(dmg), C.HERO_CX - 8, 36, blocked ? COLORS.cyan : COLORS.red));
    this.burst(C.HERO_CX + 6, C.GROUND_Y - 36, blocked ? COLORS.cyan : COLORS.red, blocked ? 5 : 8, blocked ? 30 : 55);
    this.shake = blocked ? .04 : .12;
    if (this.heroHp <= 0) {
      this.heroHp = 0;
      this.heroState = "dead";
      this.heroT = 0;
      this.deadTimer = 2.2;
      this.burst(C.HERO_CX, C.GROUND_Y - 40, COLORS.white, 18, 70);
    } else if (this.heroState !== "atk") {
      this.heroState = "hurt";
      this.heroT = 0;
    }
  },
  finishKill(e) {
    this.kills++;
    this.wave++;
    this.coins += 3 + Math.floor(this.wave / 2);
    const p = this.enemyCenter(e);
    this.burst(p.x, p.y, COLORS.gold, 16, 70);
    this.enemy = null;
    this.spawn = C.SPAWN_WAIT;
    persist();
    ui.refreshCoins();
  },
  burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) this.particles.push(new Particle(x, y, color, power));
  },
  /* ---------- cizim ---------- */
  draw() {
    const sx = this.shake > 0 ? ((Math.random() * 3) | 0) - 1 : 0;
    const sy = this.shake > 0 ? ((Math.random() * 3) | 0) - 1 : 0;
    ctx.save();
    ctx.translate(sx, sy);
    this.drawWorld(ctx);
    if (this.enemy) this.drawEnemy(ctx, this.enemy);
    this.drawHero(ctx);
    for (const p of this.particles) p.draw(ctx);
    for (const t of this.texts) t.draw(ctx);
    this.drawBars(ctx);
    ctx.restore();
  },
  drawWorld(g) {
    rect(g, 0, 0, C.W, C.H, COLORS.sky);
    rect(g, 0, 48, C.W, C.GROUND_Y - 52, COLORS.sky2);
    for (let i = 0; i < 12; i++) {
      const x = (i * 21 + ((this.time * 6) | 0)) % (C.W + 20) - 10;
      const y = 6 + ((i * 13) % 36);
      rect(g, x, y, 2, 1, "#68717a");
    }
    this.drawMountain(g, 28, C.GROUND_Y - 10, 22, "#303843");
    this.drawMountain(g, 76, C.GROUND_Y - 7, 28, "#38404b");
    this.drawMountain(g, 118, C.GROUND_Y - 11, 23, "#303843");
    rect(g, 0, C.GROUND_Y - 6, C.W, 7, COLORS.grass2);
    rect(g, 0, C.GROUND_Y - 3, C.W, 6, COLORS.grass);
    for (let x = 0; x < C.W; x += 9) {
      const y = C.GROUND_Y - 4 + ((Math.sin((x + this.time * 10) * .21) * 1.5) | 0);
      rect(g, x, y, 5, 2, "#7b8c5b");
    }
    rect(g, 0, C.GROUND_Y + 3, C.W, C.H - C.GROUND_Y - 3, COLORS.dirt);
    for (let x = 3; x < C.W; x += 16) {
      rect(g, x, C.GROUND_Y + 7 + ((x * 3) % 7), 9, 2, "#4d4140");
    }
  },
  drawMountain(g, x, baseY, h, color) {
    for (let r = 0; r < h; r++) {
      const half = (r * .72) | 0;
      rect(g, x - half, baseY - r, half * 2 + 1, 1, color);
    }
  },
  heroAnim() {
    if (this.heroState === "dead") {
      const f = Math.min(3, (this.heroT / .5 * 4) | 0);
      return ["sol_death", f];
    }
    if (this.heroState === "atk") {
      const f = Math.min(5, (this.heroT / .42 * 6) | 0);
      return ["sol_atk", f];
    }
    if (this.heroState === "hurt") {
      const f = Math.min(3, (this.heroT / .3 * 4) | 0);
      return ["sol_hurt", f];
    }
    return ["sol_idle", ((this.time * 9) | 0) % 6];
  },
  drawHero(g) {
    const [sheet, f] = this.heroAnim();
    drawSheet(g, IMG[sheet], f, C.HERO_CX, C.GROUND_Y, C.HERO_SCALE, false, false);

    if (this.guard > 0 && this.heroState !== "dead") {
      const y = C.GROUND_Y - 60;
      rect(g, C.HERO_CX + 26, y + 14, 14, 26, COLORS.ink);
      rect(g, C.HERO_CX + 28, y + 16, 10, 22, "#5fa9ba");
      rect(g, C.HERO_CX + 31, y + 22, 4, 10, "#2c5965");
    }
  },
  drawEnemy(g, e) {
    const t = e.type;
    if (t.kind === "sheet") {
      let sheet, f;
      if (e.state === "death") { sheet = t.sprite + "_death"; f = Math.min(3, (e.t / .5 * 4) | 0); }
      else if (e.state === "atk") { sheet = t.sprite + "_atk"; f = Math.min(5, (e.t / .48 * 6) | 0); }
      else if (e.state === "hurt") { sheet = t.sprite + "_hurt"; f = Math.min(3, (e.t / .25 * 4) | 0); }
      else if (e.state === "walk") { sheet = t.sprite + "_walk"; f = ((this.time * 12) | 0) % 8; }
      else { sheet = t.sprite + "_idle"; f = ((this.time * 9) | 0) % 6; }
      drawSheet(g, IMG[sheet], f, e.x, C.GROUND_Y, t.scale, true, e.flash > 0);
      return;
    }
    // 0x72 tek kare: saldirida hamle (lunge) yapar
    const moving = e.state === "walk";
    const f = ((this.time * 8) | 0) % 4;
    const img = IMG[t.sprite + (moving ? "_run_" : "_idle_") + f];
    let lx = e.x;
    if (e.state === "atk") lx -= Math.sin(Math.min(1, e.t / .48) * Math.PI) * 10;
    const bob = t.flying ? (Math.sin(e.bob) * 4) | 0 : 0;
    drawFrame(g, img, lx, e.y + bob, t.scale, true, e.flash > 0 || e.state === "hurt");
  },
  drawBars(g) {
    this.drawBar(g, 6, 26, 40, 4, this.heroHp / C.HERO_MAX_HP, COLORS.green);
    const e = this.enemy;
    if (e && e.state !== "death" && e.x < C.W - 4) {
      this.drawBar(g, C.W - 46, 26, 40, 4, e.hp / e.maxHp, COLORS.red);
    }
    if (this.heroState === "dead") {
      const txt = "RESPAWN";
      rect(g, (C.W - 62) >> 1, 54, 62, 14, "#111016");
      drawText(g, txt, (C.W - textWidth(txt)) >> 1, 58, COLORS.white);
    }
  },
  drawBar(g, x, y, w, h, pct, color) {
    pct = clamp(pct, 0, 1);
    rect(g, x - 1, y - 1, w + 2, h + 2, COLORS.ink);
    rect(g, x, y, w, h, "#342d35");
    rect(g, x, y, Math.round(w * pct), h, color);
    rect(g, x, y, Math.max(0, Math.round(w * pct) - 1), 1, "#ffffff");
  }
};

/* ---------- UI katmanlari ---------- */
const ui = {
  view: 0, // 0 mini, 1 panel, 2 menu
  tab: "w",
  el: {
    panel: document.getElementById("panel"),
    menu: document.getElementById("menu"),
    body: document.getElementById("mBody"),
    coinTxt1: document.getElementById("coinTxt1"),
    coinTxt2: document.getElementById("coinTxt2"),
  },
  init() {
    document.getElementById("coinImg1").src = "data:image/png;base64," + SPRITES.coin_0;
    document.getElementById("coinImg2").src = "data:image/png;base64," + SPRITES.coin_0;

    canvas.addEventListener("pointerdown", evt => {
      evt.preventDefault();
      this.show(1);
    });
    document.getElementById("btnClosePanel").addEventListener("click", () => this.show(0));
    document.getElementById("btnWeapons").addEventListener("click", () => { this.tab = "w"; this.show(2); });
    document.getElementById("btnStats").addEventListener("click", () => { this.tab = "i"; this.show(2); });
    document.getElementById("btnCloseMenu").addEventListener("click", () => this.show(0));
    this.el.panel.addEventListener("pointerdown", evt => {
      if (evt.target === this.el.panel) this.show(2); // pencere disina 2. dokunus -> asil menu
    });
    for (const b of document.querySelectorAll(".tab")) {
      b.addEventListener("click", () => {
        this.tab = b.dataset.tab;
        this.render();
      });
    }
  },
  show(v) {
    this.view = v;
    this.el.panel.classList.toggle("hidden", v !== 1);
    this.el.menu.classList.toggle("hidden", v !== 2);
    if (v > 0) this.refreshCoins();
    if (v === 2) this.render();
  },
  refreshCoins() {
    if (this.view === 0) return;
    this.el.coinTxt1.textContent = game.coins;
    this.el.coinTxt2.textContent = game.coins;
  },
  render() {
    for (const b of document.querySelectorAll(".tab"))
      b.classList.toggle("on", b.dataset.tab === this.tab);
    const body = this.el.body;
    body.innerHTML = "";
    if (this.tab === "w") this.renderGear(body, WEAPONS, "unlockedW", "weaponIndex", w => `+${w.dmg} hasar / ${w.cd}s`, w => {
      const img = document.createElement("img");
      img.src = "data:image/png;base64," + SPRITES["wpn_" + w.id];
      return img;
    });
    else if (this.tab === "a") this.renderGear(body, ARMORS, "unlockedA", "armorIndex", a => `+${a.def} savunma`, a => {
      const d = document.createElement("div");
      d.className = "aicon";
      d.style.background = a.color;
      return d;
    });
    else this.renderStats(body);
  },
  renderGear(body, items, unlockKey, selKey, statFn, iconFn) {
    items.forEach((item, i) => {
      const unlocked = game[unlockKey].includes(i);
      const sel = game[selKey] === i;
      const card = document.createElement("div");
      card.className = "card" + (sel ? " sel" : "") + (unlocked ? "" : " lock");
      card.appendChild(iconFn(item));
      const info = document.createElement("div");
      info.className = "cInfo";
      info.innerHTML = `<div class="cName">${item.name}</div><div class="cStat">${statFn(item)} — ${item.desc}</div>`;
      card.appendChild(info);
      const act = document.createElement("div");
      act.className = "cAct";
      if (sel) act.textContent = "SECILI";
      else if (unlocked) { act.textContent = "SEC"; act.classList.add("price"); }
      else if (game.coins >= item.cost) { act.textContent = item.cost + " AL"; act.classList.add("price"); }
      else { act.textContent = item.cost; act.classList.add("no"); }
      card.appendChild(act);
      card.addEventListener("click", () => {
        if (!unlocked) {
          if (game.coins < item.cost) return;
          game.coins -= item.cost;
          game[unlockKey].push(i);
        }
        game[selKey] = i;
        persist();
        this.refreshCoins();
        this.render();
      });
      body.appendChild(card);
    });
  },
  renderStats(body) {
    const rows = [
      ["SEVIYE", game.wave],
      ["OLDURULEN", game.kills],
      ["COIN", game.coins],
      ["SILAH", WEAPONS[game.weaponIndex].name],
      ["ZIRH", ARMORS[game.armorIndex].name],
      ["CAN", Math.ceil(game.heroHp) + " / " + C.HERO_MAX_HP],
    ];
    for (const [k, v] of rows) {
      const d = document.createElement("div");
      d.className = "statLine";
      d.innerHTML = `<span>${k}</span><span>${v}</span>`;
      body.appendChild(d);
    }
  }
};

/* klavye (masaustu test) */
window.addEventListener("keydown", evt => {
  if (evt.code === "Space" || evt.code === "ArrowRight") game.pressed.slash = true;
  if (evt.code === "ArrowLeft" || evt.code === "ShiftLeft") {
    game.pressed.guard = true;
    game.guard = C.GUARD_TIME;
  }
  if (evt.code === "Escape") ui.show(0);
});
window.addEventListener("keyup", evt => {
  if (evt.code === "Space" || evt.code === "ArrowRight") game.pressed.slash = false;
  if (evt.code === "ArrowLeft" || evt.code === "ShiftLeft") game.pressed.guard = false;
});

ui.init();
game.init();
