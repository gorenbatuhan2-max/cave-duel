<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cave Duel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111016;
    color: #f4eadb;
    font-family: "Courier New", monospace;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: grid; place-items: center; }
  /* UI 1: seffaf zemin - telefon duvar kagidi gorunsun */
  body.v1, body.v1 html { background: transparent; }
  #app { display: flex; flex-direction: column; align-items: center; }
  #stage { position: relative; box-shadow: 0 0 0 2px #050407, 0 18px 60px rgba(0,0,0,.55); }
  body.v1 #stage { box-shadow: none; }
  canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body.v1 #stage { width: min(100vw, 100dvh, 760px); aspect-ratio: 1 / 1; }
  body.v2 #stage { width: min(100vw, calc(100dvh * 12 / 7), 980px); aspect-ratio: 12 / 7; }
  body.v3 #app { width: min(100vw, 440px); height: 100dvh; }
  body.v3 #stage { width: 100%; aspect-ratio: 12 / 7; flex: none; }
  #hud { display: none; }
  body.v3 #hud {
    display: flex; flex-direction: column;
    width: 100%; flex: 1; overflow-y: auto;
    background: #14111a;
    border: 3px solid #0a0910; border-top: none;
  }
  .hudHead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 6px;
  }
  .stageName { color: #d8b765; font-weight: bold; font-size: clamp(12px, 4vw, 17px); letter-spacing: 1px; text-shadow: 1px 1px 0 #0a0910; }
  .coinRow { display: flex; align-items: center; gap: 5px; color: #d8b765; font-weight: bold; font-size: clamp(12px, 4vw, 17px); }
  .coinRow img { width: 14px; image-rendering: pixelated; }
  .hpWrap { padding: 2px 12px 10px; }
  .hpOuter { position: relative; height: 18px; background: #342d35; border: 2px solid #0a0910; }
  .hpFill { position: absolute; inset: 0; width: 100%; background: linear-gradient(#8fe08d, #67d06d 40%, #3f9c50); transition: width .15s; }
  .hpTxt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: bold; color: #0e1410; }
  .secTitle {
    padding: 8px 12px 4px;
    color: #8d8394; font-weight: bold; letter-spacing: 2px;
    font-size: clamp(10px, 3.4vw, 14px);
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 2px 12px 6px; }
  .slot {
    background: #1f1a26;
    border: 2px solid #0a0910;
    padding: 7px 4px 5px;
    text-align: center;
    cursor: pointer;
    min-height: 58px;
  }
  .slot.sel { border-color: #d8b765; background: #2a2430; }
  .slot.lock { opacity: .55; }
  .slot img { height: 22px; image-rendering: pixelated; }
  .slot .aic { width: 20px; height: 20px; margin: 1px auto; border: 2px solid #0a0910; }
  .slot .nm { font-size: 9px; font-weight: bold; color: #f4eadb; margin-top: 3px; letter-spacing: .5px; }
  .slot .pr { font-size: 9px; font-weight: bold; color: #d8b765; }
  .slot .pr.no { color: #d85850; }
  .slot.empty { display: grid; place-items: center; color: #4a4152; font-weight: bold; font-size: 10px; cursor: default; }
</style>
</head>
<body class="v3">
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Cave duel"></canvas>
  </div>
  <div id="hud">
    <div class="hudHead">
      <span class="stageName" id="stageName">BÖLÜM 1</span>
      <span class="coinRow"><img id="coinImg" alt=""><span id="coinTxt">0</span></span>
    </div>
    <div class="hpWrap">
      <div class="hpOuter">
        <div class="hpFill" id="hpFill"></div>
        <div class="hpTxt" id="hpTxt"></div>
      </div>
    </div>
    <div class="secTitle">ENVANTER — SİLAH</div>
    <div class="grid" id="invW"></div>
    <div class="secTitle">ENVANTER — ZIRH</div>
    <div class="grid" id="invA"></div>
    <div class="secTitle">SKİLLER</div>
    <div class="grid" id="skills"></div>
  </div>
</div>

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function drawText(g, text, x, y, color) {
  g.fillStyle = color;
  text = String(text).toUpperCase();
  for (let i = 0; i < text.length; i++) {
    const glyph = FONT[text[i]];
    if (!glyph) continue;
    const gx = x + i * 4;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 3; c++)
        if (glyph[r][c] === "1") g.fillRect(gx + c, y + r, 1, 1);
  }
}

function textWidth(text) { return String(text).length * 4 - 1; }

function rect(g, x, y, w, h, color) {
  g.fillStyle = color;
  g.fillRect(x | 0, y | 0, w | 0, h | 0);
}

    fxCanvas.width = 100; fxCanvas.height = 100;
    fxCtx.clearRect(0, 0, 100, 100);
    fxCtx.drawImage(img, frame * 100, 0, 100, 100, 0, 0, 100, 100);
    fxCtx.globalCompositeOperation = "source-atop";
    fxCtx.fillStyle = "#ffffff";
    fxCtx.fillRect(0, 0, 100, 100);
    fxCtx.globalCompositeOperation = "source-over";
    src = fxCanvas; sx = 0;
  }
  g.save();
  g.imageSmoothingEnabled = false;
  if (flip) { g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  g.drawImage(src, sx, 0, 100, 100, cx - 50 * s, footY - (footRow + 1) * s, 100 * s, 100 * s);
  g.restore();
}

class Particle {
  constructor(x, y, color, power) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - .5) * power;
    this.vy = -Math.random() * power - 8;
    this.life = .25 + Math.random() * .35;
    this.color = color;
    this.size = Math.random() < .45 ? 1 : 2;
  }
  update(dt) {
    this.vy += 145 * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  draw(g) { rect(g, this.x, this.y, this.size, this.size, this.color); }
}

class FloatText {
  constructor(text, x, y, color) {
    this.text = text; this.x = x; this.y = y;
    this.color = color; this.life = .75;
  }
  update(dt) { this.y -= 18 * dt; this.life -= dt; }
  draw(g) { drawText(g, this.text, this.x | 0, this.y | 0, this.color); }
}

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem("caveDuelSave"));
    if (s && typeof s === "object") return s;
  } catch (e) {}
  return null;
}
function persist() {
  try {
    localStorage.setItem("caveDuelSave", JSON.stringify({
      coins: game.coins, wave: game.wave, kills: game.kills,
      weapon: game.weaponIndex, armor: game.armorIndex,
      unlockedW: game.unlockedW, unlockedA: game.unlockedA
    }));
  } catch (e) {}
}

const game = {
  time: 0,
  last: 0,
  mode: "travel",
  worldX: 0,
  heroHp: C.HERO_MAX_HP,
  heroState: "idle",
  heroT: 0,
  heroHitDone: false,
  enemy: null,
  wave: 1,
  kills: 0,
  coins: 0,
  slashCd: 0,
  autoCd: .85,
  guard: 0,
  shake: 0,
  enemyAtk: C.ENEMY_ATK_CD,
  deadTimer: 0,
  weaponIndex: 0,
  armorIndex: 0,
  unlockedW: [0],
  unlockedA: [0],
  pressed: { slash: false, guard: false },
  particles: [],
  texts: [],
  init() {
    const s = loadSave();
    if (s) {
      this.coins = s.coins | 0;
      this.wave = Math.max(1, s.wave | 0);
      this.kills = s.kills | 0;
      this.weaponIndex = clamp(s.weapon | 0, 0, WEAPONS.length - 1);
      this.armorIndex = clamp(s.armor | 0, 0, ARMORS.length - 1);
      if (Array.isArray(s.unlockedW)) this.unlockedW = s.unlockedW;
      if (Array.isArray(s.unlockedA)) this.unlockedA = s.unlockedA;
      if (!this.unlockedW.includes(this.weaponIndex)) this.weaponIndex = 0;
      if (!this.unlockedA.includes(this.armorIndex)) this.armorIndex = 0;
    }
    this.spawnEnemy();
    requestAnimationFrame(t => this.loop(t));
  },
  currentWeapon() { return WEAPONS[this.weaponIndex]; },
  currentArmor() { return ARMORS[this.armorIndex]; },
  spawnEnemy() {
    const type = ENEMIES[(this.wave - 1) % ENEMIES.length];
    const hpBoost = Math.floor(this.wave * 10 + this.kills * 4);
    this.enemy = {
      type,
      hp: type.hp + hpBoost,
      maxHp: type.hp + hpBoost,
      state: "wait",
      t: 0,
      hitDone: false,
      flash: 0,
      scale: C.MS,
      targetX: C.ETX,
      x: C.W + 60,
      worldX: this.worldX + C.SPAWN_AHEAD,
    };
    this.mode = "travel";
  },
  loop(t) {
    const dt = Math.min((t - this.last) / 1000 || 0, .05);
    this.last = t;
    this.time += dt;
    this.update(dt);
    this.draw();
    requestAnimationFrame(v => this.loop(v));
  },
  update(dt) {
    this.slashCd = Math.max(0, this.slashCd - dt);
    this.autoCd = Math.max(0, this.autoCd - dt);
    this.guard = Math.max(0, this.guard - dt);
    this.shake = Math.max(0, this.shake - dt);
    this.heroT += dt;

    if (this.heroState === "dead") {
      this.deadTimer -= dt;
      if (this.deadTimer <= 0) {
        this.heroHp = C.HERO_MAX_HP;
        this.heroState = "idle";
        this.heroT = 0;
        this.wave = Math.max(1, this.wave - 1);
        persist();
        ui.refresh();
      }
    } else {
      if (this.mode === "travel") {
        this.worldX += C.RUN_SPEED * dt;
      }
      if (this.heroState === "atk") {
        if (this.heroT >= .28 && !this.heroHitDone) {
          this.heroHitDone = true;
          this.applyHeroHit();
        }
        if (this.heroT >= .42) { this.heroState = "idle"; this.heroT = 0; }
      } else if (this.heroState === "hurt") {
        if (this.heroT >= .3) { this.heroState = "idle"; this.heroT = 0; }
      }
      if (this.mode === "fight") {
        if (this.pressed.guard && this.guard <= C.GUARD_TIME * .25) this.guard = C.GUARD_TIME;
        if ((this.pressed.slash || this.autoCd <= 0) && this.slashCd <= 0 && this.heroState !== "atk") {
          this.heroAttack();
        }
      }
    }

    if (this.enemy) this.updateEnemy(dt);

    this.particles = this.particles.filter(p => (p.update(dt), p.life > 0));
    this.texts = this.texts.filter(t => (t.update(dt), t.life > 0));
  },
  heroAttack() {
    this.heroState = "atk";
    this.heroT = 0;
    this.heroHitDone = false;
    this.slashCd = this.currentWeapon().cd;
    this.autoCd = .95;
  },
  applyHeroHit() {
    const e = this.enemy;
    if (!e || e.state === "death" || this.mode !== "fight") return;
    const weapon = this.currentWeapon();
    const guardedBonus = this.guard > 0 ? 5 : 0;
    const dmg = C.HERO_DMG + weapon.dmg + Math.floor(this.wave * 1.4) + guardedBonus;
    e.hp -= dmg;
    e.flash = .12;
    const p = this.enemyCenter(e);
    this.texts.push(new FloatText(String(dmg), p.x - 5, p.top - 8, COLORS.gold));
    this.burst(p.x, p.y, COLORS.red, 8, 55);
    this.shake = .08;
    if (e.hp <= 0) {
      e.hp = 0;
      e.state = "death";
      e.t = 0;
    } else if (e.state !== "atk") {
      e.state = "hurt";
      e.t = 0;
    }
  },
  enemyCenter(e) {
    const s = e.scale;
    return { x: e.x, y: C.GROUND_Y - 10 * s, top: C.GROUND_Y - 21 * s };
  },
  updateEnemy(dt) {
    const e = this.enemy;
    e.flash = Math.max(0, e.flash - dt);
    e.t += dt;

    if (this.mode === "travel") {
      e.x = e.worldX - this.worldX;
      if (this.heroState !== "dead" && e.x <= e.targetX) {
        e.x = e.targetX;
        this.mode = "fight";
        e.state = "idle";
        e.t = 0;
        this.enemyAtk = (C.ENEMY_ATK_CD * .6 + Math.random() * .3) * e.type.cdm;
        this.autoCd = Math.min(this.autoCd, .4);
      }
      return;
    }

    if (e.state === "death") {
      if (e.t >= .5) this.finishKill(e);
      return;
    }
    if (e.state === "hurt") {
      if (e.t >= .25) { e.state = "idle"; e.t = 0; }
      return;
    }
    if (e.state === "atk") {
      if (e.t >= .3 && !e.hitDone) {
        e.hitDone = true;
        this.applyEnemyHit(e);
      }
      if (e.t >= .48) { e.state = "idle"; e.t = 0; }
      return;
    }
    if (this.heroState !== "dead") {
      this.enemyAtk -= dt;
      if (this.enemyAtk <= 0) {
        e.state = "atk"; e.t = 0; e.hitDone = false;
        this.enemyAtk = (C.ENEMY_ATK_CD + Math.random() * .35 - this.wave * .015) * e.type.cdm;
      }
    }
  },
  applyEnemyHit(e) {
    if (this.heroState === "dead") return;
    const blocked = this.guard > 0;
    const def = this.currentArmor().def;
    let dmg;
    if (blocked) dmg = Math.max(1, Math.floor(e.type.dmg * .28) - Math.floor(def / 2));
    else dmg = Math.max(1, e.type.dmg + Math.floor(this.wave * .7) - def);
    this.heroHp -= dmg;
    this.texts.push(new FloatText(blocked ? "GUARD" : String(dmg), C.HERO_CX - 8, C.GROUND_Y - 24 * C.HS + 6, blocked ? COLORS.cyan : COLORS.red));
    this.burst(C.HERO_CX + 6, C.GROUND_Y - 9 * C.HS, blocked ? COLORS.cyan : COLORS.red, blocked ? 5 : 8, blocked ? 30 : 55);
    this.shake = blocked ? .04 : .12;
    if (this.heroHp <= 0) {
      this.heroHp = 0;
      this.heroState = "dead";
      this.heroT = 0;
      this.deadTimer = 2.2;
      this.burst(C.HERO_CX, C.GROUND_Y - 10 * C.HS, COLORS.white, 18, 70);
    } else if (this.heroState !== "atk") {
      this.heroState = "hurt";
      this.heroT = 0;
    }
    ui.refresh();
  },
  finishKill(e) {
    this.kills++;
    this.wave++;
    this.coins += (3 + Math.floor(this.wave / 2)) * (e.type.cm || 1);
    const p = this.enemyCenter(e);
    this.burst(p.x, p.y, COLORS.gold, 16, 70);
    persist();
    ui.refresh();
    this.spawnEnemy();
  },
  burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) this.particles.push(new Particle(x, y, color, power));
  },
  /* ---------- cizim ---------- */
  draw() {
    ctx.clearRect(0, 0, C.W, C.H);
    const sx = this.shake > 0 ? ((Math.random() * 3) | 0) - 1 : 0;
    const sy = this.shake > 0 ? ((Math.random() * 3) | 0) - 1 : 0;
    ctx.save();
    ctx.translate(sx, sy);
    this.drawWorld(ctx);
    if (this.enemy) this.drawEnemy(ctx, this.enemy);
    this.drawHero(ctx);
    for (const p of this.particles) p.draw(ctx);
    for (const t of this.texts) t.draw(ctx);
    this.drawBars(ctx);
    ctx.restore();
  },
  drawWorld(g) {
    if (VIEW === 1) {
      /* seffaf gokyuzu: duvar kagidi gorunur, sadece yildizlar */
      for (let i = 0; i < 14; i++) {
        const x = (i * 53 + 11) % C.W;
        const y = (i * 37 + 5) % 72;
        const tw = Math.sin(this.time * 1.8 + i * 2.1);
        if (tw > -.3) {
          g.globalAlpha = .45 + tw * .3;
          rect(g, x, y, 2, 1, COLORS.star);
          if (tw > .75) rect(g, x, y - 1, 1, 3, COLORS.star);
        }
      }
      g.globalAlpha = 1;
    } else {
      rect(g, 0, 0, C.W, C.H, COLORS.skyTop);
      const bg = IMG.bg;
      if (bg && bg.complete && bg.naturalWidth) {
        const bw = bg.naturalWidth, bh = bg.naturalHeight;
        let ox = -((this.worldX * .15) % bw) | 0;
        if (ox > 0) ox -= bw;
        for (let x = ox; x < C.W; x += bw) g.drawImage(bg, x, C.GROUND_Y - bh);
      }
      rect(g, 0, C.GROUND_Y, C.W, C.H - C.GROUND_Y, "#2a1f16");
    }
    const ter = IMG.ter;
    if (ter && ter.complete && ter.naturalWidth) {
      const tw = ter.naturalWidth;
      let ox = -(this.worldX % tw) | 0;
      if (ox > 0) ox -= tw;
      for (let x = ox; x < C.W; x += tw) g.drawImage(ter, x, C.GROUND_Y - C.TER_SURFACE);
    }
  },
  heroAnim() {
    if (this.heroState === "dead") return ["sol_death", Math.min(3, (this.heroT / .5 * 4) | 0)];
    if (this.heroState === "atk") return ["sol_atk", Math.min(5, (this.heroT / .42 * 6) | 0)];
    if (this.heroState === "hurt") return ["sol_hurt", Math.min(3, (this.heroT / .3 * 4) | 0)];
    if (this.mode === "travel") return ["sol_walk", ((this.time * 12) | 0) % 8];
    return ["sol_idle", ((this.time * 9) | 0) % 6];
  },
  drawHero(g) {
    const [sheet, f] = this.heroAnim();
    drawSheet(g, IMG[sheet], f, C.HERO_CX, C.GROUND_Y, C.HS, false, false, C.SOL_FOOT);
    if (this.guard > 0 && this.heroState !== "dead" && this.mode === "fight") {
      const y = C.GROUND_Y - 15 * C.HS;
      rect(g, C.HERO_CX + 6 * C.HS, y + 3 * C.HS, 3.5 * C.HS, 6.5 * C.HS, COLORS.ink);
      rect(g, C.HERO_CX + 6.5 * C.HS, y + 3.5 * C.HS, 2.5 * C.HS, 5.5 * C.HS, "#5fa9ba");
    }
  },
  drawEnemy(g, e) {
    if (e.x > C.W + 30) return;
    const t = e.type;
    let sheet, f;
    if (e.state === "death") { sheet = t.sprite + "_death"; f = Math.min(3, (e.t / .5 * 4) | 0); }
    else if (e.state === "atk") { sheet = t.sprite + "_atk"; f = Math.min(5, (e.t / .48 * 6) | 0); }
    else if (e.state === "hurt") { sheet = t.sprite + "_hurt"; f = Math.min(3, (e.t / .25 * 4) | 0); }
    else { sheet = t.sprite + "_idle"; f = ((this.time * 9) | 0) % 6; }
    drawSheet(g, IMG[sheet], f, e.x, C.GROUND_Y, e.scale, true, e.flash > 0, C.ORC_FOOT);
  },
  drawBars(g) {
    const heroTop = C.GROUND_Y - 24 * C.HS + 12;
    if (VIEW !== 3) {
      this.drawBar(g, C.HERO_CX - 20, Math.max(8, heroTop), 40, 4, this.heroHp / C.HERO_MAX_HP, COLORS.green);
    }
    const e = this.enemy;
    if (e && e.state !== "death" && e.x < C.W - 4) {
      const p = this.enemyCenter(e);
      const bx = clamp((p.x - 20) | 0, 2, C.W - 44);
      this.drawBar(g, bx, Math.max(8, p.top - 8), 40, 4, e.hp / e.maxHp, COLORS.red);
    }
    if (this.heroState === "dead") {
      const txt = "RESPAWN";
      rect(g, (C.W - 62) >> 1, 54, 62, 14, "#111016");
      drawText(g, txt, (C.W - textWidth(txt)) >> 1, 58, COLORS.white);
    }
  },
  drawBar(g, x, y, w, h, pct, color) {
    pct = clamp(pct, 0, 1);
    rect(g, x - 1, y - 1, w + 2, h + 2, COLORS.ink);
    rect(g, x, y, w, h, "#342d35");
    rect(g, x, y, Math.round(w * pct), h, color);
    rect(g, x, y, Math.max(0, Math.round(w * pct) - 1), 1, "#ffffff");
  }
};

/* ---------- UI3 HUD ---------- */
const ui = {
  active: VIEW === 3,
  el: {},
  init() {
    if (!this.active) return;
    this.el.stageName = document.getElementById("stageName");
    this.el.coinTxt = document.getElementById("coinTxt");
    this.el.hpFill = document.getElementById("hpFill");
    this.el.hpTxt = document.getElementById("hpTxt");
    this.el.invW = document.getElementById("invW");
    this.el.invA = document.getElementById("invA");
    this.el.skills = document.getElementById("skills");
    document.getElementById("coinImg").src = "data:image/png;base64," + SPRITES.coin_0;
    this.renderInv();
    this.renderSkills();
    this.refresh();
  },
  refresh() {
    if (!this.active) return;
    const stage = STAGES[(((game.wave - 1) / 4) | 0) % STAGES.length];
    this.el.stageName.textContent = "BÖLÜM " + game.wave + " — " + stage;
    this.el.coinTxt.textContent = game.coins;
    const pct = clamp(game.heroHp / C.HERO_MAX_HP, 0, 1);
    this.el.hpFill.style.width = (pct * 100).toFixed(1) + "%";
    this.el.hpTxt.textContent = Math.ceil(game.heroHp) + " / " + C.HERO_MAX_HP;
  },
  renderInv() {
    this.buildGrid(this.el.invW, WEAPONS, "unlockedW", "weaponIndex", item => {
      const img = document.createElement("img");
      img.src = "data:image/png;base64," + SPRITES["wpn_" + item.id];
      return img;
    });
    this.buildGrid(this.el.invA, ARMORS, "unlockedA", "armorIndex", item => {
      const d = document.createElement("div");
      d.className = "aic";
      d.style.background = item.color;
      return d;
    });
  },
  buildGrid(root, items, unlockKey, selKey, iconFn) {
    root.innerHTML = "";
    items.forEach((item, i) => {
      const unlocked = game[unlockKey].includes(i);
      const sel = game[selKey] === i;
      const slot = document.createElement("div");
      slot.className = "slot" + (sel ? " sel" : "") + (unlocked ? "" : " lock");
      slot.appendChild(iconFn(item));
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = item.name;
      slot.appendChild(nm);
      if (!unlocked) {
        const pr = document.createElement("div");
        pr.className = "pr" + (game.coins >= item.cost ? "" : " no");
        pr.textContent = item.cost + "c";
        slot.appendChild(pr);
      }
      slot.addEventListener("click", () => {
        if (!unlocked) {
          if (game.coins < item.cost) return;
          game.coins -= item.cost;
          game[unlockKey].push(i);
        }
        game[selKey] = i;
        persist();
        this.renderInv();
        this.refresh();
      });
      root.appendChild(slot);
    });
  },
  renderSkills() {
    this.el.skills.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const slot = document.createElement("div");
      slot.className = "slot empty";
      slot.textContent = "BOŞ";
      this.el.skills.appendChild(slot);
    }
  }
};

/* klavye (masaustu test) */
window.addEventListener("keydown", evt => {
  if (evt.code === "Space" || evt.code === "ArrowRight") game.pressed.slash = true;
  if (evt.code === "ArrowLeft" || evt.code === "ShiftLeft") {
    game.pressed.guard = true;
    game.guard = C.GUARD_TIME;
  }
});
window.addEventListener("keyup", evt => {
  if (evt.code === "Space" || evt.code === "ArrowRight") game.pressed.slash = false;
  if (evt.code === "ArrowLeft" || evt.code === "ShiftLeft") game.pressed.guard = false;
});

ui.init();
game.init();
